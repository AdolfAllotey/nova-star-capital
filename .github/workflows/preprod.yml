name: Preprod CI

on:
  push:
    branches: [ "main" ]
    paths:
      - "src/**"
      - "requirements*.txt"
      - ".github/workflows/**"
      - "ops/**"
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements-lock.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install deps (locked)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-lock.txt

      # Lint (si ruff/flake8 sont présents dans ton lock, sinon étape passe)
      - name: Lint (ruff/flake8 if available)
        run: |
          (ruff --version && ruff check .) || echo "ruff not installed, skipping"
          (flake8 --version && flake8 .) || echo "flake8 not installed, skipping"

      # Tests (si pytest présent)
      - name: Tests (pytest if available)
        run: |
          (pytest -q) || echo "pytest not installed or tests failed; adjust as needed"

  # Déploiement préprod — manuel et optionnel (protéger l'env 'preprod' côté GitHub)
  deploy-preprod:
    needs: [ci]
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    environment: preprod
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy code to server (rsync over SSH)
        uses: burnett01/rsync-deployments@6.0
        with:
          switches: -az --delete
          path: .
          remote_path: ${{ secrets.NSC_PREPROD_PATH }}
          remote_host: ${{ secrets.NSC_PREPROD_HOST }}
          remote_user: ${{ secrets.NSC_PREPROD_USER }}
          remote_key: ${{ secrets.NSC_PREPROD_SSH_KEY }}

      - name: Restart systemd service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.NSC_PREPROD_HOST }}
          username: ${{ secrets.NSC_PREPROD_USER }}
          key: ${{ secrets.NSC_PREPROD_SSH_KEY }}
          script: |
            sudo systemctl daemon-reload
            sudo systemctl restart nsc-api.service
            sleep 2
            systemctl is-active --quiet nsc-api.service && echo "service ok"
